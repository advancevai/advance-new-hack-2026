      * { box-sizing: border-box; }
      html, body, iframe { width: 100%; height: 100%; background: #000; }
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: Impact, "Arial Black", "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      iframe { border: 0; display: block; }
      button { cursor: pointer !important; user-select: none; -webkit-user-select: none; font: inherit; }
      .iframe-container { position: absolute; inset: 0; z-index: 1; }

        top: 10px;
        right: 10px;
        left: auto;
        width: min(220px, 64vw, 46vh);
        z-index: 9999;
        cursor: move;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      .neon-panel {
        container-type: inline-size;
        container-name: panel;
        position: relative;
        width: 100%;
        aspect-ratio: 1225 / 1284;
        isolation: isolate;
        transform-style: preserve-3d;
        animation: panelFloat 6.5s ease-in-out infinite;
        filter: drop-shadow(0 0 2.5cqw rgba(255, 170, 0, .32))
                drop-shadow(0 0 4.5cqw rgba(165, 0, 255, .30));
      }
      .aura {
        position: absolute;
        inset: -10% -13%;
        z-index: 1;
        pointer-events: none;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0 8%, rgba(255, 190, 0, .20) 13%, transparent 22%,
          rgba(180, 0, 255, .24) 34%, transparent 46%,
          rgba(255, 210, 60, .18) 58%, transparent 70%,
          rgba(210, 0, 255, .22) 82%, transparent 94%
        );
        filter: blur(3.2cqw);
        animation: auraSpin 12s linear infinite, auraBreathe 4s ease-in-out infinite alternate;
      }
      .orbit {
        position: absolute;
        inset: -11%;
        z-index: 3;
        pointer-events: none;
        animation: orbitSpin 15s linear infinite;
      }
      .orbit i {
        position: absolute;
        left: 50%; top: 50%;
        width: .9cqw; height: .9cqw;
        margin: -.45cqw 0 0 -.45cqw;
        border-radius: 50%;
        background: var(--c, #ffd34a);
        box-shadow: 0 0 1.2cqw .35cqw var(--c, #ffd34a), 0 0 2.4cqw var(--c, #ffd34a);
        transform: rotate(var(--a)) translateX(var(--r));
        animation: sparkBlink 2.2s ease-in-out infinite;
        animation-delay: var(--d, 0s);
        opacity: .85;
      }

      .panel-art {
        position: absolute;
        inset: 0;
        z-index: 2;
        overflow: hidden;
        border-radius: 2.5cqw;
        background-image: var(--panel-img);
        background-size: 100% 100%;
        background-repeat: no-repeat;
        box-shadow: inset 0 0 3cqw rgba(255, 180, 0, .12), inset 0 0 7cqw rgba(120, 0, 180, .16);
        animation: artBreathe 4.2s ease-in-out infinite;
      }
      .image-breath,
      .scan,
      .color-orbit,
      .surge-flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .image-breath {
        background-image: var(--panel-img);
        background-size: 100% 100%;
        background-repeat: no-repeat;
        filter: blur(1.25cqw) brightness(1.85) saturate(1.4);
        opacity: .20;
        mix-blend-mode: screen;
        animation: breathScale 4.6s ease-in-out infinite alternate;
      }
      .scan {
        background: linear-gradient(115deg, transparent 34%, rgba(255,255,255,.10) 46%, rgba(255,225,120,.20) 50%, rgba(255,255,255,.08) 54%, transparent 66%);
        background-size: 240% 240%;
        mix-blend-mode: screen;
        opacity: .55;
        animation: scanMove 5.4s linear infinite;
      }
      .color-orbit {
        inset: -28%;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent, rgba(255,190,0,.22), transparent 28%, rgba(190,0,255,.24), transparent 58%, rgba(0,234,255,.16), transparent 84%);
        mix-blend-mode: color-dodge;
        opacity: .12;
        animation: spin 16s linear infinite;
      }
      .surge-flash {
        z-index: 17;
        background: radial-gradient(circle at 45% 55%, rgba(255,240,170,.38), rgba(190,0,255,.16) 38%, transparent 72%);
        opacity: 0;
        mix-blend-mode: screen;
      }
      .surge-flash.flash { animation: surgeFlash .7s ease-out; }

      /* travelling light on the gold frame */
      .edge { position: absolute; pointer-events: none; z-index: 4; opacity: .9; filter: blur(.25cqw); }
      .edge-top {
        left: 4%; right: 4%; top: 10.6%; height: 1%;
        background: linear-gradient(90deg, transparent, #ffd75a, #fff8c0, #ffae00, transparent);
        background-size: 220% 100%;
        animation: edgeX 3.1s linear infinite;
      }
      .edge-bottom {
        left: 9%; right: 9%; bottom: 21.4%; height: .9%;
        background: linear-gradient(90deg, transparent, #ffcf3d, #fff3a0, #c26b00, transparent);
        background-size: 220% 100%;
        animation: edgeX 3.7s linear infinite reverse;
      }
      .edge-left {
        left: 7.2%; top: 24%; height: 54%; width: .9%;
        background: linear-gradient(180deg, transparent, #ffd75a, #fff8c0, #d97a00, transparent);
        background-size: 100% 220%;
        animation: edgeY 4.2s linear infinite;
      }
      .edge-right {
        right: 7.2%; top: 24%; height: 54%; width: .9%;
        background: linear-gradient(180deg, transparent, #d64dff, #ffd75a, #fff8c0, transparent);
        background-size: 100% 220%;
        animation: edgeY 4.8s linear infinite reverse;
      }
      .corner-glow {
        position: absolute; z-index: 4; pointer-events: none;
        width: 18%; height: 15%;
        background: radial-gradient(circle, rgba(255,190,0,.22), transparent 68%);
        animation: cornerPulse 3.4s ease-in-out infinite;
      }
      .corner-glow.tl { left: 2%; top: 20%; animation-delay: -.4s; }
      .corner-glow.tr { right: 2%; top: 20%; animation-delay: -1.2s; }
      .corner-glow.bl { left: 2%; bottom: 19%; animation-delay: -2s; }
      .corner-glow.br { right: 2%; bottom: 19%; animation-delay: -2.8s; }

      /* header life */
      .crest-star { display: none; }
      .brand-badge {
        position: absolute; z-index: 8; pointer-events: none;
        left: 50%; top: 1%;
        width: 10cqw; height: 10cqw;
        margin-left: -5cqw;
        border-radius: 50%;
        background-image: var(--logo-img);
        background-size: cover;
        background-position: center;
        border: .45cqw solid #ffd34a;
        box-shadow: 0 0 1.6cqw #ffb000, 0 0 3.4cqw rgba(180,0,255,.75), inset 0 0 1.2cqw rgba(0,0,0,.65);
        animation: badgeFloat 3.2s ease-in-out infinite;
      }
      .brand-badge::after {
        content: "";
        position: absolute;
        inset: -1cqw;
        border: .22cqw dashed rgba(255,215,70,.9);
        border-radius: 50%;
        animation: spin 7s linear infinite;
      }
      .header-shimmer {
        position: absolute; z-index: 5; pointer-events: none;
        left: 9%; top: 10%; width: 82%; height: 15%;
        background: linear-gradient(100deg, transparent 30%, rgba(255,246,180,.28) 48%, rgba(255,255,255,.12) 52%, transparent 70%);
        background-size: 230% 100%;
        mix-blend-mode: screen;
        animation: headerSweep 4.5s linear infinite;
      }
      .subtitle-glow {
        position: absolute; z-index: 4; pointer-events: none;
        left: 28%; top: 17.4%; width: 44%; height: 8%;
        background: radial-gradient(ellipse, rgba(200,0,255,.35), rgba(120,0,255,.12) 55%, transparent 75%);
        mix-blend-mode: screen;
        animation: subtitlePulse 2.6s ease-in-out infinite;
      }
      .wing-glow {
        position: absolute; z-index: 4; pointer-events: none;
        top: 13%; width: 12%; height: 8%;
        background: radial-gradient(ellipse, rgba(255,190,0,.35), transparent 70%);
        mix-blend-mode: screen;
        animation: wingPulse 2.8s ease-in-out infinite;
      }
      .wing-glow.left { left: 3%; }
      .wing-glow.right { right: 3%; animation-delay: -1.4s; }
      .confidence-shimmer {
        position: absolute; z-index: 5; pointer-events: none;
        left: 10%; top: 24.5%; width: 23%; height: 12%;
        background: linear-gradient(100deg, transparent 35%, rgba(255,230,120,.24) 50%, transparent 65%);
        background-size: 220% 100%;
        mix-blend-mode: screen;
        animation: confShimmer 3.8s linear infinite;
      }

      /* ---------- LIVE SIGNAL LAYER ---------- */
      #signalSection {
        position: absolute;
        inset: 0;
        z-index: 8;
        pointer-events: none;
      }
      .signal-plate, .wave-plate, .period-plate {
        position: absolute;
        z-index: 5;
        pointer-events: none;
        mix-blend-mode: screen;
      }
      .signal-plate {
        left: 38.8%; top: 35.8%; width: 41.5%; height: 20.5%;
        background: radial-gradient(ellipse at center, rgba(255,150,0,.13), rgba(120,0,180,.05) 45%, transparent 74%);
        animation: signalGlow 2.4s ease-in-out infinite;
      }
      .wave-plate {
        left: 29.3%; top: 68.4%; width: 39.6%; height: 8%;
        background: radial-gradient(ellipse at center, rgba(190,0,255,.16), transparent 74%);
        animation: subtitlePulse 2.2s ease-in-out infinite;
      }
      .period-plate {
        left: 67.4%; top: 69.3%; width: 23.6%; height: 8.4%;
        background: radial-gradient(ellipse at center, rgba(0,210,255,.14), transparent 74%);
        animation: periodPulse 2.7s ease-in-out infinite;
      }
      .signal-glow {
        position: absolute; z-index: 6; pointer-events: none;
        left: 38.8%; top: 35.8%; width: 41.5%; height: 20.5%;
        background: radial-gradient(ellipse at center, rgba(255,170,0,.10), transparent 68%);
        mix-blend-mode: screen;
        animation: signalGlow 2.8s ease-in-out infinite reverse;
      }

      #signalResult {
        position: absolute; z-index: 7; pointer-events: none;
        left: 38.8%; top: 35.8%; width: 41.5%; height: 20.5%;
        display: flex; align-items: center; justify-content: center;
        font-family: Impact, "Arial Black", sans-serif;
        font-weight: 900;
        font-size: clamp(24px, 13.4cqw, 70px);
        line-height: 1;
        letter-spacing: -.035em;
        white-space: nowrap;
        color: #ffd34a;
        background: linear-gradient(180deg, #fff4a8 0%, #ffd83c 28%, #ffae00 68%, #b85c00 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        -webkit-text-stroke: .55cqw #542100;
        text-shadow:
          0 0 .8cqw rgba(255, 210, 60, .95),
          0 0 2cqw rgba(255, 130, 0, .75),
          .35cqw .45cqw 0 rgba(70, 22, 0, .95);
        filter: drop-shadow(0 0 1.2cqw rgba(255, 150, 0, .55));
        transform-origin: center;
        animation: signalPulse 2.4s ease-in-out infinite;
      }
      #signalResult.signal-big {
        font-size: clamp(30px, 16.2cqw, 86px);
        background-image: linear-gradient(180deg, #fff6b0 0%, #ffc02e 35%, #ff7a00 75%, #9a3500 100%);
      }
      #signalResult.signal-small { background-image: linear-gradient(180deg, #fff4a8 0%, #ffd83c 28%, #ffae00 68%, #b85c00 100%); }
      #signalResult:not(.signal-big):not(.signal-small) { font-size: clamp(18px, 10cqw, 48px); }

      .orb-halo {
        position: absolute; z-index: 4; pointer-events: none;
        left: 16.2%; top: 33.2%; width: 27%; height: 26%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,30,120,.30), rgba(150,0,255,.22) 45%, transparent 72%);
        filter: blur(1.8cqw);
        mix-blend-mode: screen;
        animation: orbHalo 3.4s ease-in-out infinite;
      }
      .orb-ring {
        position: absolute; z-index: 5; pointer-events: none;
        left: 16.2%; top: 33.2%; width: 27%; height: 26%;
        border-radius: 50%;
        background: repeating-conic-gradient(from 0deg, rgba(255,210,60,.0) 0 8deg, rgba(255,210,60,.55) 8deg 11deg, rgba(210,50,255,.0) 11deg 19deg, rgba(210,50,255,.45) 19deg 22deg, transparent 22deg 30deg);
        -webkit-mask-image: radial-gradient(circle, transparent 0 61%, #000 63% 66%, transparent 68%);
        mask-image: radial-gradient(circle, transparent 0 61%, #000 63% 66%, transparent 68%);
        opacity: .75;
        animation: spin 8s linear infinite;
      }
      #numDisplay {
        position: absolute; z-index: 7; pointer-events: none;
        left: 19.15%; top: 36.2%; width: 21.2%; height: 20.25%;
        display: flex; align-items: center; justify-content: center;
      }
      #numDisplay .num-ball {
        --c1: #ff1654; --c2: #a800d8; --c3: #ff007f; --glow: #ff2b6d;
        position: relative;
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        border-radius: 50%;
        border: .32cqw solid rgba(255,255,255,.78);
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 900;
        font-size: clamp(17px, 8.2cqw, 46px);
